name: Security audit

# Known CVEs in the lockfiles (mix.lock).
# Runs on every push to main, every pull request (Renovate's too), every
# Monday 06:00 UTC and by hand. The weekly run matters: new CVEs are published
# against code that did not change. A red scheduled run does not touch prod;
# look at the Actions tab on Mondays.
#
# Findings fail the job only when the repo variable AUDIT_ENFORCE is "true".
# Fix by bumping, or acknowledge with a reason and an ignoreUntil date in
# osv-scanner.toml. Never delete this job to get a change out
# (docs/SECURITY-DEPENDENCIES.md).

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

# A newer push cancels the older pull request run. The event name is in the
# group so the weekly run never cancels a run on main.
concurrency:
  group: audit-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      issues: write
    env:
      AUDIT_ENFORCE: ${{ vars.AUDIT_ENFORCE }}
    steps:
      # Third-party actions are pinned to a commit, not a movable tag.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Dependency CVEs (osv-scanner, pinned by SHA-256)
        run: scripts/security-audit.sh

      # Nobody reads a red scheduled run: GitHub emails only the person who last
      # edited the cron line. One open issue per repo (comment on repeats) puts
      # the finding where the team looks.
      - name: Open an issue when the weekly run fails
        if: failure() && github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          title="Weekly security audit failed"
          body="The scheduled audit found known vulnerabilities or an end-of-life nixpkgs channel. Run: $RUN_URL. Fix, or acknowledge with a reason and date (docs/SECURITY-DEPENDENCIES.md)."
          n=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "\"$title\" in:title" --json number --jq '.[0].number // empty')
          if [ -n "$n" ]; then
            gh issue comment "$n" --repo "$GITHUB_REPOSITORY" --body "Still failing on $(date -u +%F). $RUN_URL"
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$title" --body "$body"
          fi
