# osv-scanner acknowledgements (scripts/security-audit.sh, audit workflow).
#
# Only for advisories that do not apply to us or have no fixed release yet.
# Every entry needs a reason and an ignoreUntil at most 90 days ahead; after
# that date the finding fails again. Fixing is the default: see
# docs/SECURITY-DEPENDENCIES.md.
#
# [[IgnoredVulns]]
# id = "GHSA-xxxx-xxxx-xxxx"
# ignoreUntil = 2027-01-15
# reason = "pkg 1.2.3 is dev-only and the vulnerable function is never called; fixed upstream in 2.0 (major)"

# Baseline acknowledged on 2026-10-27, when the audit was introduced. The other
# 22 findings that day were fixed by `mix deps.update` (gun, mint, castore,
# hpax, cowlib). Re-check each by the date.

[[IgnoredVulns]]
id = "EEF-CVE-2026-43966"
ignoreUntil = 2027-01-20
reason = "cowlib 2.21.0 (HTTP response splitting via non-VCHAR bytes in cow_http_struct_hd:escape_string/2): no fixed release exists yet. cowlib is pulled in by gun. Check Hex for a newer cowlib by the date."

[[IgnoredVulns]]
id = "GHSA-w4f7-4cxr-rv3c"
ignoreUntil = 2027-01-20
reason = "gun 2.7.0 (cowboy/gun HTTP request/response splitting): Hex has no newer gun than 2.7.0 (`mix hex.outdated gun` says up to date) though the advisory lists 2.16.0. NOT dismissed as irrelevant: lib/uptrack_worker/monitoring/gun_connection.ex sends customer-configured URLs and headers, so check that CR/LF is rejected before they reach gun (the truckex repo documents the same kind of guard). Re-check for a gun release by the date."

[[IgnoredVulns]]
id = "EEF-CVE-2026-32686"
ignoreUntil = 2027-01-20
reason = "decimal 2.4.1 (unbounded exponent in Decimal.new, unauthenticated DoS): the worker's own code never uses Decimal (grep of lib/ is empty); it is a transitive dependency of appsignal. decimal 3.x is blocked because jason's optional requirement is ~> 1.0 or ~> 2.0. Clears when jason allows decimal 3."

[[IgnoredVulns]]
id = "GHSA-rhv4-8758-jx7v"
ignoreUntil = 2027-01-20
reason = "decimal 2.4.1 (same advisory as EEF-CVE-2026-32686, GitHub id)."

[[IgnoredVulns]]
id = "EEF-CVE-2026-97853"
ignoreUntil = 2027-01-20
reason = "decimal 2.4.1 (unbounded allocation in Decimal.round/3 places argument): same path and reason as EEF-CVE-2026-32686; nothing in lib/ calls Decimal."
